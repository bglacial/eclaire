apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingFile = rootProject.file('../.play-signing.local/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

android {
    namespace = "fr.eclaire.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.eclaire.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.1.0-alpha.22"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingFile.exists()) {
            play {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.play
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    // Shared guidance scenarios, also run by the TypeScript and Swift engines.
    sourceSets { test { resources.srcDirs += ['../../tests/fixtures'] } }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    testImplementation 'androidx.car.app:app-testing:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyReleaseDex') {
    group = 'verification'
    description = 'Checks code optimization and uncompressed DEX size in the Play bundle.'
    dependsOn 'bundleRelease'
    def bundle = layout.buildDirectory.file('outputs/bundle/release/app-release.aab')
    inputs.file(bundle)

    doLast {
        new java.util.zip.ZipFile(bundle.get().asFile).withCloseable { zip ->
            def dex = zip.entries().findAll { it.name ==~ /[^\/]+\/dex\/classes\d*\.dex/ }
            def metadata = zip.getEntry('BUNDLE-METADATA/com.android.tools/r8.json')
            if (dex.isEmpty() || metadata == null) throw new GradleException('The Play bundle must contain DEX files and R8 metrics.')

            def r8 = zip.getInputStream(metadata).withCloseable { new groovy.json.JsonSlurper().parse(it) }
            def checksums = dex.collect { entry ->
                zip.getInputStream(entry).withCloseable { stream ->
                    java.security.MessageDigest.getInstance('SHA-256').digest(stream.bytes).encodeHex().toString()
                }
            }
            if (checksums.sort() != r8.dexFiles*.checksum.sort()) throw new GradleException('R8 metrics do not match the packaged DEX files.')
            logger.lifecycle("Uncompressed DEX: ${dex.sum { it.size }} bytes (${dex.size()} files)")
            [shrinking: 'noShrinkingPercentage', optimization: 'noOptimizationPercentage', obfuscation: 'noObfuscationPercentage'].each { name, key ->
                def unoptimized = r8.stats?.get(key)
                if (!(unoptimized instanceof Number) || unoptimized < 0 || unoptimized > 100) throw new GradleException("Invalid R8 ${name} metric.")
                def score = 100 - unoptimized
                logger.lifecycle("R8 ${name}: ${score}%")
                if (score < 25) throw new GradleException("R8 ${name} is below the 25% Play threshold.")
            }
        }
    }
}

tasks.named('check') { dependsOn 'verifyReleaseDex' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
